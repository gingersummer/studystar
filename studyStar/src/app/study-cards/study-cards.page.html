<ion-header [translucent]="true">
    <ion-title>Study Cards</ion-title>
  <ion-menu side="end" menuId="collection" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <!-- This is the menu content. -->
      <ion-list [inset]="true">
        <ion-item [button]="true" (click)="redirectToProfile()">
          <ion-icon color="danger" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToFlashcards()">
          <ion-icon color="tertiary" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Flashcards</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToAgenda()">
          <ion-icon color="success" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Agenda</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToHome()">
          <ion-icon color="success" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="first-div"></div>

  <app-flashcard class="flashcard-actual" [flashcardIn]="cardToDisplay">

  </app-flashcard>
  <!-- <app-confidence [flashcardIn]="cardToDisplay"> -->

  <!-- </app-confidence> -->
   <ion-button class="prev-button-style" (click)="previousCard()">
Previous Card
  </ion-button>
  <ion-button class="next-button-style" (click)="nextCard()">
Next Card
  </ion-button>
  <p class="progress-p-style">Progress: {{indexOfCards +1}}/{{flashcardSet.length}}</p>

</ion-content>
