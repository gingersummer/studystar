<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Study Cards</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

<p>
  Progress: {{indexOfCards +1}}/{{flashcardSet.length}}
</p>

  <app-flashcard [flashcardIn]="cardToDisplay">

  </app-flashcard>
   <ion-button (click)="previousCard()">
Previous Card
  </ion-button>
  <ion-button (click)="nextCard()">
Next Card
  </ion-button>

</ion-content>
