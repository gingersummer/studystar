<ion-header>
  <ion-toolbar>
    <ion-title>New Task</ion-title>
    <ion-button slot="end" (click)="dismissModal()">X</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-list>
      <ion-item>
        <ion-input label="Task Name: " [(ngModel)]="taskName"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Task Month Due: " [(ngModel)]="taskMonth"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Task Day Due: " [(ngModel)]="taskDay"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Task Year Due: " [(ngModel)]="taskYear"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Task Priority: " [(ngModel)]="taskPriority"></ion-input>
      </ion-item>
    </ion-list>
  </ion-card>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button slot="start" (click)="addTask()">Add Task</ion-button>
  </ion-toolbar>
</ion-footer>
