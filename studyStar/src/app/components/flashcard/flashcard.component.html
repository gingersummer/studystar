<ion-grid>
    <ion-row>
        <!-- 
        Setting col-12 on mobile, col-4 on tablets/desktop 
        means the card takes up 1/3 of the width of the row.
      -->
        <ion-col size="15" size-md="5">
            <ion-card class="ratio-3x4">
                <ion-card-content (click)="switchSides()" class="flashcard">
                    @if(flashcardIn.frontSide){

                    <ion-title class="term-style">
                        {{flashcardIn.term}}
                    </ion-title>
                    }
                    @else{

                    <ion-title class="term-style">{{flashcardIn.definition}}</ion-title>
                    }
                    <p class="confidence-level-style">Confidence: {{flashcardIn.confidenceLevel}}</p>


                </ion-card-content>
            </ion-card>
        </ion-col>
    </ion-row>
</ion-grid>
