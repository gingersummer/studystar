<ion-grid>
    <ion-row>
        <!-- 
        Setting col-12 on mobile, col-4 on tablets/desktop 
        means the card takes up 1/3 of the width of the row.
      -->
        <ion-col size="15" size-md="5">
            <ion-card class="ratio-3x4">
                <ion-card-content (click)="switchSides()">
                    @if(flashcardIn.frontSide){

                    <ion-title>
                        {{flashcardIn.term}}
                    </ion-title>
                    Confidence: {{flashcardIn.confidenceLevel}}
                    }
                    @else{
                        
                    {{flashcardIn.definition}}
                    }

                </ion-card-content>
            </ion-card>
        </ion-col>
        <ion-col>
            Confidence
            <ion-button (click)="selectC(1)"> 1. Not Confident </ion-button>
            <ion-button (click)="selectC(2)"> 2. Semi Confident </ion-button>
            <ion-button (click)="selectC(3)"> 3. Very Confident </ion-button>
            <ion-button (click)="selectC(4)"> 4. Mastered </ion-button>
        </ion-col>
    </ion-row>
</ion-grid>
