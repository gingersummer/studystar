<ion-card class="ratio-3x4" color="light">
    <ion-card-content class="flashcard" (click)="switchSides()" class="flashcard">
        @if(flashcardIn.frontSide){

        <h1 class="term-style">
            {{flashcardIn.term}}
        </h1>
        }
        @else{

        <h1 class="term-style">{{flashcardIn.definition}}</h1>
        }
        <p class="confidence-level-style">Confidence: {{flashcardIn.confidenceLevel}}</p>


    </ion-card-content>
</ion-card>
