<ion-header>
  <ion-toolbar>
    <ion-title>Register Account</ion-title>
    <ion-button slot="end" (click)="dismissModal()">X</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-list>
      <ion-item>
        <ion-input label="Email: " [(ngModel)]="regEmailIn"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Username: " [(ngModel)]="regUsernameIn"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Password: " type="password" [(ngModel)]="regPasswordIn"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Confirm Password: " type="password" [(ngModel)]="regPasswordConfIn"></ion-input>
      </ion-item>
    </ion-list>
  </ion-card>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button slot="start" (click)="register()">Register Account</ion-button>
  </ion-toolbar>
</ion-footer>
