<div class="ion-page" id="main-content">
  <ion-header class="header">
    <ion-toolbar class="nav-toolbar">
      <div slot="start" class="brand-container">
        <ion-icon name="star" class="logo-icon"></ion-icon>
        <span class="brand-title">StudyStar</span>
      </div>

      <div class="center-nav">
        <button class="nav-btn" (click)="redirectToHome()">Home</button>
        <button class="nav-btn" (click)="redirectToFlashcards()">Flashcards</button>
        <button class="nav-btn" (click)="redirectToAgenda()">Agenda</button>
        <button class="nav-btn active" (click)="redirectToProfile()">Dashboard</button>
        <button class="nav-btn" (click)="redirectToStudyMethods()">Study Methods</button>
      </div>

      <ion-buttons slot="end" class="right-actions">
        <ion-button shape="round" class="profile-btn" (click)="signOut()">Log Out</ion-button>
        <ion-avatar>
          <img src="https://cdn.pfps.gg/pfps/8250-default-18.png" />
        </ion-avatar>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="homepage-content">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <div class="profile-page-items">
      @if(currentUser) {
        <div class="profile-summary">
          <ion-avatar class="profile-picture">
            <img src="https://cdn.pfps.gg/pfps/8250-default-18.png" />
          </ion-avatar>
          <ion-row>
            <ion-col>
          <h1 class="profile-username">{{currentUser.username}}</h1>
          <p class="profile-email">{{currentUser.email}}</p>
</ion-col>
<ion-col>
          <div class="streak-badge">
            <ion-icon name="flame" class="streak-icon"></ion-icon>
            <p class="streak-text"><strong>{{streakCount}}</strong> Day Streak</p>
           
          </div>
           </ion-col>
          </ion-row>
        </div>

        <div class="quick-links">
          <div class="quick-link-card" (click)="redirectToFlashcards()">
            <ion-icon name="albums-outline"></ion-icon>
            <p>Study Flashcards</p>
          </div>
          <div class="quick-link-card" (click)="redirectToAgenda()">
            <ion-icon name="calendar-outline"></ion-icon>
            <p>View Agenda</p>
          </div>
          <div class="quick-link-card" (click)="redirectToStudyMethods()">
            <ion-icon name="bulb-outline"></ion-icon>
            <p>Explore Study Methods</p>
          </div>
        </div>
      }
      @else {
        <ion-button (click)="redirectToLogin()">
          Create A New Account Or Login To An Existing One
        </ion-button>
      }
    </div>
  </ion-content>
</div>
