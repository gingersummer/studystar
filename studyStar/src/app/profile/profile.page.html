<ion-content>
  <ion-menu side="end" menuId="profile" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <!-- This is the menu content. -->
      <ion-list [inset]="true">
        <ion-item [button]="true" (click)="redirectToProfile()">
          <ion-icon color="danger" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToFlashcards()">
          <ion-icon color="tertiary" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Flashcards</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToAgenda()">
          <ion-icon color="success" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Agenda</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToHome()">
          <ion-icon color="success" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-button (click)="signOut()" slot="start">Log Out</ion-button>
        <ion-grid>
          <ion-row>
            <ion-title>
              StudyStars
            </ion-title>
          </ion-row>
        </ion-grid>
        <ion-buttons slot="end">
          <ion-menu-button (click)="openMenu()"></ion-menu-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <div class="profile-page-items">
      <ion-card>
        <h1>
          Profile
        </h1>
      </ion-card>
      <ion-avatar class="profile-picture">
        <img src="https://ionicframework.com/docs/img/demos/avatar.svg" />
      </ion-avatar>

      @if(currentUser) {
      <ion-card class="profile-card">
        <h1>
          Username: {{currentUser.username}}
        </h1>
        <h1>
          Email: {{currentUser.email}}
        </h1>
        <h1>
          Most Recent Study Set: {{currentUser.lastSet}}
        </h1>
        <h1>
          Sets Completed: {{currentUser.setsCompleted}}
        </h1>
      </ion-card>
      }
    </div>
  </div>
</ion-content>
