@if(addingSet){
<ion-input placeholder="Enter Name" label="Name Of Set" [(ngModel)]="newSetName"></ion-input>
<ion-button (click)="createNewSet()"> Create </ion-button>
}

@else{

<ion-content>
  <ion-menu side="end" menuId="collection" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <!-- This is the menu content. -->
      <ion-list [inset]="true">
        <ion-item [button]="true" (click)="redirectToProfile()">
          <ion-icon color="7e4ca2" slot="start" name="star" size="large"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToFlashcards()">
          <ion-icon color="7e4ca2" slot="start" name="copy" size="large"></ion-icon>
          <ion-label>Flashcards</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToAgenda()">
          <ion-icon color="7e4ca2" slot="start" name="today" size="large"></ion-icon>
          <ion-label>Agenda</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToHome()">
          <ion-icon color="7e4ca2" slot="start" name="list-circle" size="large"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item [button]="true" (click)="redirectToLogin()">
        <ion-icon color="#8238b7" slot="start" name="person" size="large"></ion-icon>
        <ion-label>Login</ion-label>
      </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-grid>
          <ion-row>
            <ion-title>
              StudyStar
            </ion-title>
            <ion-searchbar class=searchBar search-icon="star" placeholder="Search">
            </ion-searchbar>
          </ion-row>
        </ion-grid>
        <ion-buttons slot="end">
          <ion-menu-button (click)="openMenu()"></ion-menu-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
  </div>

  <div class="smallcard">
    <ion-button (click)="addNewSet()"> Add Set </ion-button>


    <ion-grid>
      <ion-row>
        @for(item of arrayOfSets; track $index) {
        <ion-col>
          <app-flashcardcollection [flashcardToDisplay]="item" (click)="redirectToStudyCards(item)">

          </app-flashcardcollection>
        </ion-col>
        }
      </ion-row>
    </ion-grid>

  </div>


</ion-content>
}
