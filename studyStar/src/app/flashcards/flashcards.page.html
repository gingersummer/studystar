  @else{
  <ion-content>
    <div class="ion-page" id="main-content">
      <ion-header class="header">
        <ion-toolbar class="nav-toolbar">
          <div slot="start" class="brand-container">
            <ion-icon name="star" class="logo-icon"></ion-icon>
            <span class="brand-title" (click)="redirectToHome()">
              StudyStar
            </span>
          </div>

          <div class="center-nav">
            <button class="nav-btn" (click)="redirectToHome()">
              Home
            </button>
            <button class="nav-btn active" (click)="redirectToFlashcards()">
              Flashcards
            </button>
            <button class="nav-btn" (click)="redirectToAgenda()">
              Agenda
            </button>
            <button class="nav-btn" (click)="redirectToProfile()">
              Dashboard
            </button>
            <button class="nav-btn" (click)="redirectToStudyMethods()">
              Study Methods
            </button>

          </div>

          <ion-buttons slot="end" class="right-actions">
            <ion-button shape="round" class="profile-btn" (click)="signOut()">
              Log Out
            </ion-button>
            <ion-avatar class="profile-picture">
              <img src="https://cdn.pfps.gg/pfps/8250-default-18.png" />
            </ion-avatar>
          </ion-buttons>
          <!-- <ion-searchbar class=searchBar search-icon="star" placeholder="Search"></ion-searchbar> -->

        </ion-toolbar>
      </ion-header>
    </div>

    <div class="smallcard">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
      <ion-button shape="round" class="addNewStudySet" (click)="addNewSet()"> + Add New Study Set </ion-button>


      <ion-grid class="full-screen-grid">
        <ion-row>
          @for(item of arrayOfSets; track $index) {
          <ion-col size-lg="6">
            <app-flashcardcollection [flashcardToDisplay]="item" (click)="redirectToStudyCards(item, $index)">
            </app-flashcardcollection>
          </ion-col>
          }
        </ion-row>
      </ion-grid>

    </div>


  </ion-content>
