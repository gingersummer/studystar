<div class="ion-page" id="main-content">
  <ion-header class="header">
    <ion-toolbar class="nav-toolbar">
      <div slot="start" class="brand-container">
        <ion-icon name="star" class="logo-icon"></ion-icon>
        <span class="brand-title"> StudyStar </span>
      </div>

      <div class="center-nav">
        <button class="nav-btn" (click)="redirectToHome()">Home</button>
        <button class="nav-btn" (click)="redirectToFlashcards()">Flashcards</button>
        <button class="nav-btn active" (click)="redirectToAgenda()">Agenda</button>
        <button class="nav-btn" (click)="redirectToDashboard()">Dashboard</button>
      </div>

      <ion-buttons slot="end" class="right-actions">
        <ion-button shape="round" fill="solid" class="profile-btn" (click)="redirectToProfile()">
          Profile
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <div class="profile-page-items">
      <ion-grid>
        <ion-row>
          <ion-col><app-calendar></app-calendar></ion-col>

          <ion-col>
            <ion-card class="to-do-card">
              <ion-header class="ion-padding"> To-Do </ion-header>
              <ion-list>
                @for(task of tasksArray; track $index) {
                  <app-task [taskToDisplay]="task"></app-task>
                }
              </ion-list>
            </ion-card>
            <ion-card class="upcoming-card">
              <ion-header class="ion-padding"> Upcoming </ion-header>
              <ion-list>
                <ion-item>
                  <ion-label>Event 1</ion-label>
                </ion-item>
                <ion-item>
                  <ion-label>Event 2</ion-label>
                </ion-item>
              </ion-list>
            </ion-card>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <ion-button class="add-event"> Add Event </ion-button>
          </ion-col>
          <ion-col>
            <ion-button class="add-deadline"> Add Deadline </ion-button>
          </ion-col>
          <ion-col>
            <ion-button (click)="presentCreateTaskModal()" class="add-task">
              Add Task
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </ion-content>
</div>
